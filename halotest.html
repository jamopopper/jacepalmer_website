<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>halo test 2 — in-slide vs CSS layer</title>
<style>
  body { background:#000; color:#fff; font-family:-apple-system, sans-serif; margin:0; }
  .col { width:min(430px, 94vw); margin:0 auto; padding:10px 0 60px; }
  h2 { font-size:15px; margin:30px 0 4px; }
  p.note { font-size:12px; color:#aaa; margin:0 0 12px; }
  .stage { position:relative; padding-right:3.25rem; }
  .stack { display:flex; flex-direction:column; gap:14px; }
  .slide { position:relative; }
  .slide img.fg { display:block; width:100%; height:auto; border-radius:14px; }
  /* ---- Method A: current production. Halos inside each slide,
     baked blur, baked alpha ramps, NO CSS filter. ---- */
  .a .halo { position:absolute; z-index:-1; object-fit:fill; border-radius:0; pointer-events:none;
    inset:-14px -60px -14px -26px; width:calc(100% + 86px); height:calc(100% + 28px); }
  /* ---- Method B: CSS layers. One backdrop layer (z 0) under the
     photos (z 1). Tiles sized by an invisible copy of the photo;
     canvas spills 40px along the axis, keeps a real CSS filter —
     its overshoot lands under the neighbouring photos. ---- */
  .layer { position:absolute; inset:0; padding-right:3.25rem; z-index:0;
    display:flex; flex-direction:column; gap:14px; }
  .b-stack { position:relative; z-index:1; }
  .tile { position:relative; }
  .tile img.sizer { display:block; width:100%; height:auto; visibility:hidden; }
  .tile canvas { position:absolute; object-fit:fill; pointer-events:none; filter:blur(20px);
    inset:-40px -60px -40px -26px; width:calc(100% + 86px); height:calc(100% + 80px); }
</style>
</head>
<body class="tall">
<div class="col">
  <h2>Method A — in-slide halos, baked blur, no filter (current site)</h2>
  <p class="note">Same three photos, same order as the real strip.</p>
  <div class="stage a"><div class="stack">
      <div class="slide"><img class="fg" src="images/portfolio/IMG_1376.JPG" alt=""><canvas class="halo"></canvas><canvas class="halo blend"></canvas></div>
      <div class="slide"><img class="fg" src="images/portfolio/P1760160%206%20Edited.jpg" alt=""><canvas class="halo"></canvas><canvas class="halo blend"></canvas></div>
      <div class="slide"><img class="fg" src="images/portfolio/IMG_0599%2013%20Edited.jpg" alt=""><canvas class="halo"></canvas><canvas class="halo blend"></canvas></div>
  </div></div>

  <h2>Method B — CSS layer under the photos, filtered tiles, wide spill</h2>
  <p class="note">Same three photos, same order as the real strip.</p>
  <div class="stage b">
    <div class="layer">
      <div class="tile"><img class="sizer" src="images/portfolio/IMG_1376.JPG" alt=""><canvas class="tilecanvas"></canvas></div>
      <div class="tile"><img class="sizer" src="images/portfolio/P1760160%206%20Edited.jpg" alt=""><canvas class="tilecanvas"></canvas></div>
      <div class="tile"><img class="sizer" src="images/portfolio/IMG_0599%2013%20Edited.jpg" alt=""><canvas class="tilecanvas"></canvas></div>
    </div>
    <div class="stack b-stack">
      <div class="slide"><img class="fg" src="images/portfolio/IMG_1376.JPG" alt=""></div>
      <div class="slide"><img class="fg" src="images/portfolio/P1760160%206%20Edited.jpg" alt=""></div>
      <div class="slide"><img class="fg" src="images/portfolio/IMG_0599%2013%20Edited.jpg" alt=""></div>
    </div>
  </div>
</div>
<script>
"use strict";
// Baked blur, two stages: shrink the photo onto a 40px canvas, draw
// that up into the halo bitmap, then erase alpha ramps at both ends
// of the vertical axis (full erase at the box edge, none rampPx in).
const tinyCanvas = document.createElement("canvas");
function paintBaked(canvas, img, bitmapW, rampPx) {
    const TINY_W = 40;
    tinyCanvas.width = TINY_W;
    tinyCanvas.height = Math.max(1, Math.round(TINY_W * img.naturalHeight / img.naturalWidth));
    tinyCanvas.getContext("2d").drawImage(img, 0, 0, tinyCanvas.width, tinyCanvas.height);
    canvas.width = bitmapW;
    canvas.height = Math.max(1, Math.round(bitmapW * img.naturalHeight / img.naturalWidth));
    const ctx = canvas.getContext("2d");
    ctx.drawImage(tinyCanvas, 0, 0, canvas.width, canvas.height);
    const ramp = Math.max(1, Math.round(rampPx * canvas.height / canvas.clientHeight));
    ctx.globalCompositeOperation = "destination-out";
    let g = ctx.createLinearGradient(0, 0, 0, ramp);
    g.addColorStop(0, "rgba(0,0,0,1)"); g.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = g; ctx.fillRect(0, 0, canvas.width, ramp);
    g = ctx.createLinearGradient(0, canvas.height, 0, canvas.height - ramp);
    g.addColorStop(0, "rgba(0,0,0,1)"); g.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = g; ctx.fillRect(0, canvas.height - ramp, canvas.width, ramp);
    ctx.globalCompositeOperation = "source-over";
}
function wire(img, paints) {
    const run = () => { if (img.naturalWidth) paints.forEach(([c, w, r]) => paintBaked(c, img, w, r)); };
    if (img.complete) run(); else img.addEventListener("load", run);
}
document.querySelectorAll(".a .slide").forEach(slide => {
    const img = slide.querySelector("img.fg");
    wire(img, [[slide.querySelector(".halo"), 64, 14],
               [slide.querySelector(".halo.blend"), 160, 14]]);
});
document.querySelectorAll(".b .tile").forEach(tile => {
    const sizer = tile.querySelector("img.sizer");
    wire(sizer, [[tile.querySelector("canvas"), 160, 40]]);
});
</script>
</body>
</html>
