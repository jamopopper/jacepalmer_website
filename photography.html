        <main class="gallery" id="gallery" aria-label="Photo portfolio"></main>

        <!-- Scroll cues: fades on both edges of the strip, always on, plus
             a pair of remote-style buttons at each end; nearing an end
             merges its pair into the progress dot. Each pair forms one
             split pill — fast-forward (double triangle) steps 80% of the
             screen, skip (triangle and bar) goes to that end — with the
             icons cut out of the pill. -->
        <div class="btngroup lead">
            <button class="scrollbtn skip" id="skipStart" type="button" aria-label="Go to first photo"><svg class="for-wide" viewBox="0 0 64 64" aria-hidden="true" focusable="false"><defs><mask id="m-skipStart-wide" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64"><path d="M64 0 L32 0 A32 32 0 0 0 32 64 L64 64 Z" fill="#fff"/><g fill="#000"><path d="M53.7 17.5 L29.9 32 L53.7 46.5 Z"/><rect x="16.3" y="17.5" width="7.6" height="28.9"/></g></mask></defs><rect width="64" height="64" fill="#fff" mask="url(#m-skipStart-wide)"/></svg><svg class="for-tall" viewBox="0 0 64 64" aria-hidden="true" focusable="false"><defs><mask id="m-skipStart-tall" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64"><path d="M64 64 L64 32 A32 32 0 0 0 0 32 L0 64 Z" fill="#fff"/><g fill="#000"><path d="M17.5 53.7 L32 29.9 L46.5 53.7 Z"/><rect x="17.5" y="16.3" width="28.9" height="7.6"/></g></mask></defs><rect width="64" height="64" fill="#fff" mask="url(#m-skipStart-tall)"/></svg></button>
            <button class="scrollbtn step" id="scrollBack" type="button" aria-label="Scroll back"><svg class="for-wide" viewBox="0 0 64 64" aria-hidden="true" focusable="false"><defs><mask id="m-scrollBack-wide" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64"><path d="M0 0 L32 0 A32 32 0 0 1 32 64 L0 64 Z" fill="#fff"/><g fill="#000"><path d="M48.1 17.5 L30.3 32 L48.1 46.5 Z"/><path d="M27.7 17.5 L9.9 32 L27.7 46.5 Z"/></g></mask></defs><rect width="64" height="64" fill="#fff" mask="url(#m-scrollBack-wide)"/></svg><svg class="for-tall" viewBox="0 0 64 64" aria-hidden="true" focusable="false"><defs><mask id="m-scrollBack-tall" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64"><path d="M0 0 L0 32 A32 32 0 0 0 64 32 L64 0 Z" fill="#fff"/><g fill="#000"><path d="M17.5 48.1 L32 30.3 L46.5 48.1 Z"/><path d="M17.5 27.7 L32 9.9 L46.5 27.7 Z"/></g></mask></defs><rect width="64" height="64" fill="#fff" mask="url(#m-scrollBack-tall)"/></svg></button>
        </div>
        <div class="btngroup trail">
            <button class="scrollbtn step" id="scrollFwd" type="button" aria-label="Scroll forward"><svg class="for-wide" viewBox="0 0 64 64" aria-hidden="true" focusable="false"><defs><mask id="m-scrollFwd-wide" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64"><path d="M64 0 L32 0 A32 32 0 0 0 32 64 L64 64 Z" fill="#fff"/><g fill="#000"><path d="M15.9 17.5 L33.7 32 L15.9 46.5 Z"/><path d="M36.3 17.5 L54.1 32 L36.3 46.5 Z"/></g></mask></defs><rect width="64" height="64" fill="#fff" mask="url(#m-scrollFwd-wide)"/></svg><svg class="for-tall" viewBox="0 0 64 64" aria-hidden="true" focusable="false"><defs><mask id="m-scrollFwd-tall" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64"><path d="M64 64 L64 32 A32 32 0 0 0 0 32 L0 64 Z" fill="#fff"/><g fill="#000"><path d="M46.5 15.9 L32 33.7 L17.5 15.9 Z"/><path d="M46.5 36.3 L32 54.1 L17.5 36.3 Z"/></g></mask></defs><rect width="64" height="64" fill="#fff" mask="url(#m-scrollFwd-tall)"/></svg></button>
            <button class="scrollbtn skip" id="skipEnd" type="button" aria-label="Go to last photo"><svg class="for-wide" viewBox="0 0 64 64" aria-hidden="true" focusable="false"><defs><mask id="m-skipEnd-wide" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64"><path d="M0 0 L32 0 A32 32 0 0 1 32 64 L0 64 Z" fill="#fff"/><g fill="#000"><path d="M10.3 17.5 L34.1 32 L10.3 46.5 Z"/><rect x="40" y="17.5" width="7.6" height="28.9"/></g></mask></defs><rect width="64" height="64" fill="#fff" mask="url(#m-skipEnd-wide)"/></svg><svg class="for-tall" viewBox="0 0 64 64" aria-hidden="true" focusable="false"><defs><mask id="m-skipEnd-tall" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64"><path d="M0 0 L0 32 A32 32 0 0 0 64 32 L64 0 Z" fill="#fff"/><g fill="#000"><path d="M46.5 10.3 L32 34.1 L17.5 10.3 Z"/><rect x="17.5" y="40" width="28.9" height="7.6"/></g></mask></defs><rect width="64" height="64" fill="#fff" mask="url(#m-skipEnd-tall)"/></svg></button>
        </div>

        <!-- Scroll progress dot: travels the edge between the two pill
             pairs as the strip scrolls. -->
        <div class="scrolldot" aria-hidden="true"></div>

        <script>
            // ------------------------------------------------------------------
            // YOUR PORTFOLIO IMAGES GO HERE.
            // 1. Put your image files in /images/portfolio/ in the repo.
            // 2. List each filename below, in the order you want them shown
            //    (e.g. newest-taken first).
            //    Any web image format works: .jpg .jpeg .png .webp .gif
            // ------------------------------------------------------------------
            const PORTFOLIO_DIR = "/images/portfolio/";
            const PORTFOLIO_IMAGES = [
                // Ordered newest to oldest by file timestamp.
                "IMG_2474.jpeg",
                "IMG_2469.jpeg",
                "IMG_2471.jpeg",
                "IMG_2468.jpeg",
                "IMG_1917.jpeg",
                "IMG_1909.jpeg",
                "IMG_1906.jpeg",
                "IMG_1684.jpeg",
                "IMG_1668.JPG",
                "IMG_1545.JPG",
                "IMG_1544.JPG",
                "IMG_1324.JPG",
                "IMG_1406.JPG",
                "IMG_1404.JPG",
                "IMG_1376.JPG",
                "P1760160 6 Edited.jpg",
                "IMG_0599 13 Edited.jpg",
                "IMG_0444 10 Edited.jpg",
                "IMG_0467 4 Edited.jpg",
                "P1740326 51 Edited.jpg",
                "P1740316 49 Edited.jpg",
                "P1740278 42 Edited.jpg",
                "P1740151 26 Edited.jpg",
                "P1730856 19 Edited.JPG",
                "P1730780 3 Edited.JPG",
                "P1730723 110 Edited.jpg",
                "P1730662 106 Edited.jpg",
                "P1730625 101 Edited.jpg",
                "P1730402 68 Edited.jpg",
                "P1730240 37 Edited.jpg",
                "P1730098 19 Edited.jpg",
                "P1730082 17 Edited.jpg",
                "P1730016 11 Edited.jpg",
                "P1650044 7 Edited.jpeg",
                "P1650036 4 Edited.jpeg",
            ];

            const gallery = document.getElementById("gallery");

            // The document itself is the scroller (the gallery element
            // is only the strip's wrapper), so scroll reads and writes
            // go to the root element. This is also what lets iOS
            // Safari run the content under its top/bottom bars, like
            // a normal page — an inner container's scrolling never
            // reaches the glass.
            const scroller = document.documentElement;
            function scrollPos() {
                return document.body.classList.contains("wide") ? window.scrollX : window.scrollY;
            }
            function scrollMax() {
                return document.body.classList.contains("wide")
                    ? scroller.scrollWidth - window.innerWidth
                    : scroller.scrollHeight - window.innerHeight;
            }
            function setScrollPos(v) {
                if (document.body.classList.contains("wide")) scroller.scrollLeft = v;
                else scroller.scrollTop = v;
            }

            function showEmpty(message) {
                const empty = document.createElement("div");
                empty.className = "slide endcard";
                empty.innerHTML = "<p>" + message + "</p>";
                gallery.appendChild(empty);
            }

            if (PORTFOLIO_IMAGES.length === 0) {
                showEmpty("Portfolio coming soon.");
            } else {
                // The strip holds the photos over a separate backdrop
                // layer of blurred tiles (one per photo, sized by an
                // invisible copy of the photo). When a photo loads,
                // it's drawn into its tile's canvas at a tiny size
                // with all of the blur baked in — no CSS filter is
                // involved, so there is nothing for the browser to
                // re-render (or fringe) when the page is zoomed.
                const strip = document.createElement("div");
                strip.className = "strip";
                const pyrA = document.createElement("canvas");
                const pyrB = document.createElement("canvas");
                function paintTile(canvas, img, L) {
                    // Blur: a Kawase-style pyramid, baked into the
                    // bitmap — the tile element itself carries no CSS
                    // filter (a filter darkens an element's edges where
                    // it runs out of image, worst at the corners, and
                    // iOS re-renders filtered layers on pinch-zoom,
                    // which made corner shadows come and go). The photo
                    // is cut step by step down to ~32px wide, then
                    // doubled back up to the tile size: every step is a
                    // proper local average, and stacked averages
                    // converge on a Gaussian falloff — the Gaussian
                    // look without ever running a real Gaussian over
                    // the full-size photo. (The old one-step shrink to
                    // a tiny canvas aliased into blotches and faceted
                    // on the way back up.) The first step quarters the
                    // photo, skipping the 2000px intermediate — the
                    // most expensive pass — then halves carry it the
                    // rest of the way down. (Cutting by thirds all the
                    // way left the kernel visibly box-shaped; the
                    // halves converge smoother.) All the passes run
                    // once per photo, at load time.
                    const aspect = img.naturalHeight / img.naturalWidth;
                    let src = img;
                    let sw = img.naturalWidth;
                    let cur = pyrA;
                    let nxt = pyrB;
                    function step(w) {
                        const h = Math.max(1, Math.round(w * aspect));
                        cur.width = w;
                        cur.height = h;
                        cur.getContext("2d").drawImage(src, 0, 0, w, h);
                        src = cur;
                        sw = w;
                        const t = cur; cur = nxt; nxt = t;
                    }
                    step(Math.max(1, Math.round(img.naturalWidth / 4)));
                    while (sw > 32) step(Math.max(1, Math.round(sw / 2)));
                    while (sw < 160) step(Math.min(160, sw * 2));
                    canvas.width = 160;
                    canvas.height = Math.max(1, Math.round(160 * aspect));
                    const ctx = canvas.getContext("2d");
                    // Draw the pyramid's top level in BLED PAST the
                    // edges, with one light blur applied to the draw
                    // itself as a final polish — the blur's dark fringe
                    // lands outside the bitmap instead of on the photo's
                    // rim, and the tile's edge colors come from just
                    // inside the photo. (The polish used to be a
                    // separate copy-clear-redraw pass over the finished
                    // bitmap; that dance could lose the bitmap entirely
                    // on a loaded main thread — a tile with no backdrop
                    // at all — so the blur now happens inside the one
                    // draw that fills the tile.)
                    const bleedX = Math.round(canvas.width * 0.15);
                    const bleedY = Math.round(canvas.height * 0.15);
                    ctx.filter = "blur(4px)";
                    ctx.drawImage(src, -bleedX, -bleedY, canvas.width + 2 * bleedX, canvas.height + 2 * bleedY);
                    ctx.filter = "none";
                    // Bake the halo's feather into the bitmap itself:
                    // erase a ramp on every side, from full erase at
                    // the canvas edge to none at the photo's edge, so
                    // each tile's blur is a soft halo around its own
                    // photo and nothing else — no crossfades, no
                    // colour mixing between neighbours. Doing this in
                    // the image data — instead of a CSS mask or blend
                    // mode — keeps the effect on the plainest
                    // compositing path.
                    const horizontal = document.body.classList.contains("wide");
                    if (!L) return;
                    const axisBitmap = horizontal ? canvas.width : canvas.height;
                    const crossBitmap = horizontal ? canvas.height : canvas.width;
                    // Feather lengths in bitmap px: the halo's alpha
                    // falls across the whole spill on every side. The
                    // cross spills are 24px on the screen-edge side and
                    // 32px on the lane side (see the canvas insets).
                    const aS = Math.max(1, Math.round(L.start * axisBitmap / L.axis));
                    const aE = Math.max(1, Math.round(L.end * axisBitmap / L.axis));
                    const cE = Math.max(1, Math.round(24 * crossBitmap / L.cross));
                    const cL = Math.max(1, Math.round(32 * crossBitmap / L.cross));
                    ctx.globalCompositeOperation = "destination-out";
                    let g;
                    if (horizontal) {
                        g = ctx.createLinearGradient(0, 0, aS, 0);
                        g.addColorStop(0, "rgba(0,0,0,1)");
                        g.addColorStop(1, "rgba(0,0,0,0)");
                        ctx.fillStyle = g;
                        ctx.fillRect(0, 0, aS, canvas.height);
                        g = ctx.createLinearGradient(canvas.width, 0, canvas.width - aE, 0);
                        g.addColorStop(0, "rgba(0,0,0,1)");
                        g.addColorStop(1, "rgba(0,0,0,0)");
                        ctx.fillStyle = g;
                        ctx.fillRect(canvas.width - aE, 0, aE, canvas.height);
                        g = ctx.createLinearGradient(0, 0, 0, cE);
                        g.addColorStop(0, "rgba(0,0,0,1)");
                        g.addColorStop(1, "rgba(0,0,0,0)");
                        ctx.fillStyle = g;
                        ctx.fillRect(0, 0, canvas.width, cE);
                        g = ctx.createLinearGradient(0, canvas.height, 0, canvas.height - cL);
                        g.addColorStop(0, "rgba(0,0,0,1)");
                        g.addColorStop(1, "rgba(0,0,0,0)");
                        ctx.fillStyle = g;
                        ctx.fillRect(0, canvas.height - cL, canvas.width, cL);
                    } else {
                        g = ctx.createLinearGradient(0, 0, 0, aS);
                        g.addColorStop(0, "rgba(0,0,0,1)");
                        g.addColorStop(1, "rgba(0,0,0,0)");
                        ctx.fillStyle = g;
                        ctx.fillRect(0, 0, canvas.width, aS);
                        g = ctx.createLinearGradient(0, canvas.height, 0, canvas.height - aE);
                        g.addColorStop(0, "rgba(0,0,0,1)");
                        g.addColorStop(1, "rgba(0,0,0,0)");
                        ctx.fillStyle = g;
                        ctx.fillRect(0, canvas.height - aE, canvas.width, aE);
                        g = ctx.createLinearGradient(0, 0, cE, 0);
                        g.addColorStop(0, "rgba(0,0,0,1)");
                        g.addColorStop(1, "rgba(0,0,0,0)");
                        ctx.fillStyle = g;
                        ctx.fillRect(0, 0, cE, canvas.height);
                        g = ctx.createLinearGradient(canvas.width, 0, canvas.width - cL, 0);
                        g.addColorStop(0, "rgba(0,0,0,1)");
                        g.addColorStop(1, "rgba(0,0,0,0)");
                        ctx.fillStyle = g;
                        ctx.fillRect(canvas.width - cL, 0, cL, canvas.height);
                    }
                    ctx.globalCompositeOperation = "source-over";
                }
                // The tile canvas's display lengths along both axes,
                // read from the photo's sizer copy (which is what
                // sizes the tile) plus the canvas's spill. The feather
                // math needs these lengths, and they must come from
                // the sizer: painting used to measure the canvas
                // itself at photo-load time, when the tile might not
                // have its size yet — a lost race erased most of the
                // bitmap and the backdrop came out faint or missing.
                // Axis spill is 24px; the strip's first/last tiles
                // spill only the end-padding unit (7.75px) outward,
                // matching their canvases in the CSS. Cross spill
                // totals 56 (24 screen-edge side + 32 lane side).
                function tileLengths(entry) {
                    const horizontal = document.body.classList.contains("wide");
                    const axisPhoto = horizontal ? entry.sizer.clientWidth : entry.sizer.clientHeight;
                    const crossPhoto = horizontal ? entry.sizer.clientHeight : entry.sizer.clientWidth;
                    if (!axisPhoto || !crossPhoto) return null;
                    const start = entry.isFirst ? 7.75 : 24;
                    const end = entry.isLast ? 7.75 : 24;
                    return {
                        axis: axisPhoto + start + end,
                        cross: crossPhoto + 56,
                        start: start,
                        end: end
                    };
                }
                function tryPaint(entry) {
                    if (!entry.imgReady || !entry.sizerReady) return;
                    const L = tileLengths(entry);
                    if (L) paintTile(entry.tile, entry.img, L);
                }
                // If the screen rotates, the baked ramps sit on the wrong
                // axis — repaint every loaded photo's halos on a flip.
                // Seeded from the window's shape rather than the body
                // class: the class isn't set until setOrientation()
                // runs, and this handler must run it BEFORE checking
                // for a flip — the repaint used to check the class
                // before anything had updated it, concluded "no flip"
                // on every rotation, and left the ramps baked on the
                // old axis until a reload.
                let lastWide = window.innerWidth >= window.innerHeight;
                window.addEventListener("resize", function () {
                    setOrientation();
                    const nowWide = document.body.classList.contains("wide");
                    if (nowWide === lastWide) return;
                    lastWide = nowWide;
                    queue.forEach(function (entry) {
                        if (entry.img.complete && entry.img.naturalWidth > 0) {
                            entry.sizerReady = true;
                            tryPaint(entry);
                        }
                    });
                });
                const backdrop = document.createElement("div");
                backdrop.className = "backdrop";
                backdrop.setAttribute("aria-hidden", "true");
                strip.appendChild(backdrop);
                const queue = [];
                for (const file of PORTFOLIO_IMAGES) {
                    const slide = document.createElement("div");
                    slide.className = "slide";
                    const img = document.createElement("img");
                    img.alt = file.replace(/[-_]/g, " ").replace(/\.[^.]+$/, "");
                    slide.appendChild(img);
                    strip.appendChild(slide);
                    const tile = document.createElement("div");
                    tile.className = "tile";
                    const sizer = document.createElement("img");
                    sizer.className = "sizer";
                    sizer.alt = "";
                    tile.appendChild(sizer);
                    const tileCanvas = document.createElement("canvas");
                    tile.appendChild(tileCanvas);
                    backdrop.appendChild(tile);
                    queue.push({ img: img, file: file, sizer: sizer, tile: tileCanvas });
                }
                if (queue.length) {
                    queue[0].isFirst = true;
                    queue[queue.length - 1].isLast = true;
                }
                gallery.appendChild(strip);
                // Photos load in a small rolling window (a few in
                // flight, each finished load starting the next), so the
                // next section is ready a couple of screens before it's
                // reached instead of starting at the screen's edge.
                let nextUp = 0;
                let inFlight = 0;
                function pumpLoads() {
                    while (nextUp < queue.length && inFlight < 5) {
                        const entry = queue[nextUp++];
                        inFlight++;
                        let settled = false;
                        const settle = function () {
                            if (settled) return;
                            settled = true;
                            inFlight--;
                            pumpLoads();
                        };
                        entry.img.addEventListener("load", function () {
                            entry.imgReady = true;
                            tryPaint(entry);
                            updateFade();
                            settle();
                        });
                        entry.img.addEventListener("error", settle);
                        entry.sizer.addEventListener("load", function () {
                            entry.sizerReady = true;
                            tryPaint(entry);
                        });
                        entry.sizer.addEventListener("error", function () {
                            entry.sizerReady = true;
                            tryPaint(entry);
                        });
                        entry.img.src = PORTFOLIO_DIR + entry.file;
                        entry.sizer.src = entry.img.src;
                    }
                }
                pumpLoads();
                // The first tiles paint during the page's initial
                // layout burst, while the main thread is saturated
                // with image decodes — and a canvas painted in that
                // window can lose its commit (a backdrop that never
                // appears; a refresh drops a different one). Once the
                // page has fully loaded, repaint every ready tile:
                // identical output, committed from a settled page.
                window.addEventListener("load", function () {
                    queue.forEach(function (entry) {
                        if (entry.imgReady && entry.sizerReady) tryPaint(entry);
                    });
                });
            }

            // Scroll direction follows the screen shape: wider screens scroll
            // horizontally, taller screens scroll vertically. Re-evaluated on
            // resize so rotating a phone/tablet just works. No platform
            // detection anywhere — wheel and touch both drive the
            // document's own scrolling.
            function setOrientation() {
                document.body.classList.toggle("wide", window.innerWidth >= window.innerHeight);
                document.body.classList.toggle("tall", window.innerWidth < window.innerHeight);
            }
            window.addEventListener("resize", setOrientation);
            setOrientation();

            // Scroll cues. Fades sit on both edges of the strip, always on;
            // at each end a pill pair merges into the progress dot as its
            // end is reached; clicking a pill button smooth-scrolls the
            // strip. About 3s after the page opens, the strip also nudges
            // forward and back once — skipped if the visitor has already
            // started scrolling or their system prefers reduced motion.
            const fwdBtn = document.getElementById("scrollFwd");
            const backBtn = document.getElementById("scrollBack");
            const skipFwdBtn = document.getElementById("skipEnd");
            const skipBackBtn = document.getElementById("skipStart");
            const fwdGroup = document.querySelector(".btngroup.trail");
            const backGroup = document.querySelector(".btngroup.lead");
            const dot = document.querySelector(".scrolldot");
            const SCROLL_MS = 1467; // nudge duration — 1.5x the original 2200ms pace
            const BUTTON_MS = 880; // button scrolls: same easing at 2.5x the nudge's speed
            let nudging = false;
            let userScrolled = false;

            function updateFade() {
                const horizontal = document.body.classList.contains("wide");
                const pos = scrollPos();
                const max = scrollMax();
                // (The black edge fades were removed 2026-10-21 at
                // Jace's request — the blurred backdrop does that job.)
                // Pair/dot merge at the ends. In the last MERGE px of
                // scroll at either end, that end's pair fades out and
                // shrinks toward its far end (its transform origin sits
                // at that tip) while the dot slides from its
                // between-pairs track onto that same tip — one
                // scroll-driven motion, so the pair reads as collapsing
                // into the dot at its end, and reverses on the way back.
                // Mid-strip, the dot rides the edge between the pairs.
                function setPair(group, o) {
                    group.style.opacity = String(o);
                    group.style.transform = "scale(" + (0.55 + 0.45 * o) + ")";
                    group.style.pointerEvents = o <= 0.02 ? "none" : "";
                }
                if (max <= 0) {
                    setPair(backGroup, 0);
                    setPair(fwdGroup, 0);
                    dot.classList.add("off");
                } else {
                    const MERGE = Math.min(140, max * 0.25);
                    setPair(backGroup, Math.min(1, pos / MERGE));
                    setPair(fwdGroup, Math.min(1, (max - pos) / MERGE));
                    dot.classList.remove("off");
                    const d = dot.offsetWidth;
                    // Layout boxes, not getBoundingClientRect: the pairs
                    // are mid-shrink (transformed) while this runs, and
                    // the anchors must stay on the untransformed tips.
                    const bL = backGroup.offsetLeft, bT = backGroup.offsetTop;
                    const bW = backGroup.offsetWidth, bH = backGroup.offsetHeight;
                    const fL = fwdGroup.offsetLeft, fT = fwdGroup.offsetTop;
                    const fW = fwdGroup.offsetWidth, fH = fwdGroup.offsetHeight;
                    let v0, v1, v2, v3;
                    if (horizontal) {
                        v0 = bL; // the lead pair's start tip
                        v1 = bL + bW + 8;
                        v2 = fL - 8 - d;
                        v3 = fL + fW - d; // the trail pair's end tip
                    } else {
                        v0 = bT;
                        v1 = bT + bH + 8;
                        v2 = fT - 8 - d;
                        v3 = fT + fH - d;
                    }
                    let a;
                    if (pos <= MERGE) a = v0 + (v1 - v0) * (pos / MERGE);
                    else if (pos >= max - MERGE) a = v2 + (v3 - v2) * ((pos - (max - MERGE)) / MERGE);
                    else a = v1 + (v2 - v1) * ((pos - MERGE) / (max - 2 * MERGE));
                    if (horizontal) { dot.style.left = a + "px"; dot.style.top = ""; }
                    else { dot.style.top = a + "px"; dot.style.left = ""; }
                }
                if (!nudging && pos > 4) userScrolled = true;
            }
            // Scroll events trail the real scroll on iOS — the page
            // moves on the compositor while the event lands later —
            // which made the dot lag behind the strip. While a scroll
            // is in flight, sync from requestAnimationFrame instead:
            // every frame reads the live position, and the loop stops
            // once the position has settled for two frames.
            let fadeRaf = null;
            function requestFade() {
                if (fadeRaf !== null) return;
                let lastPos = null;
                let settled = 0;
                function step() {
                    fadeRaf = null;
                    updateFade();
                    const p = scrollPos();
                    if (p === lastPos) settled++;
                    else { settled = 0; lastPos = p; }
                    if (settled < 2) fadeRaf = requestAnimationFrame(step);
                }
                fadeRaf = requestAnimationFrame(step);
            }
            window.addEventListener("scroll", requestFade, { passive: true });
            window.addEventListener("resize", updateFade);
            updateFade();
            // Late-loading photos grow the strip after that first check,
            // when it can still measure zero overflow — re-check as each
            // photo lands so the fade is correct from the start.
            gallery.querySelectorAll("img").forEach((img) => {
                if (!img.complete) img.addEventListener("load", updateFade);
            });
            window.addEventListener("load", updateFade);

            // The nudge: the strip eases out and back symmetrically on one
            // clock — zero speed at the start, the peak, and the end.
            const easeInOut = (t) => t < 0.5
                ? 4 * t * t * t
                : 1 - Math.pow(-2 * t + 2, 3) / 2;
            let nudgeCancelled = false;
            function runNudge() {
                const distance = 48;
                const duration = SCROLL_MS;
                const start = performance.now();
                nudging = true;
                nudgeCancelled = false;
                function finish() {
                    nudging = false;
                }
                function frame(now) {
                    if (nudgeCancelled) { finish(); return; }
                    const p = Math.min((now - start) / duration, 1);
                    const out = p < 0.5 ? easeInOut(p * 2) : easeInOut(2 - p * 2);
                    setScrollPos(distance * out);
                    if (p < 1) requestAnimationFrame(frame);
                    else finish();
                }
                requestAnimationFrame(frame);
            }
            // A real scroll attempt during an animation hands control over.
            let buttonAnim = null;
            function cancelAnimations() {
                nudgeCancelled = true;
                buttonAnim = null;
            }
            window.addEventListener("wheel", cancelAnimations, { passive: true });
            window.addEventListener("touchstart", cancelAnimations, { passive: true });

            // Arrow buttons: smooth-scroll 80% of the screen dimension in
            // the strip's direction, eased like the nudge over BUTTON_MS.
            function smoothScrollBy(delta) {
                cancelAnimations();
                const from = scrollPos();
                const max = scrollMax();
                const to = Math.max(0, Math.min(max, from + delta));
                if (to === from) return;
                const token = {};
                buttonAnim = token;
                const start = performance.now();
                function frame(now) {
                    if (buttonAnim !== token) return;
                    const p = Math.min((now - start) / BUTTON_MS, 1);
                    setScrollPos(from + (to - from) * easeInOut(p));
                    if (p < 1) requestAnimationFrame(frame);
                    else buttonAnim = null;
                }
                requestAnimationFrame(frame);
            }
            function screenDelta(sign) {
                const horizontal = document.body.classList.contains("wide");
                return sign * 0.8 * (horizontal ? window.innerWidth : window.innerHeight);
            }
            fwdBtn.addEventListener("click", () => smoothScrollBy(screenDelta(1)));
            backBtn.addEventListener("click", () => smoothScrollBy(screenDelta(-1)));
            // Skip buttons ride the same animation to the strip's end —
            // the clamp in smoothScrollBy lands them exactly on it.
            skipFwdBtn.addEventListener("click", () => smoothScrollBy(Number.MAX_SAFE_INTEGER));
            skipBackBtn.addEventListener("click", () => smoothScrollBy(-Number.MAX_SAFE_INTEGER));

            // The progress dot is a scrubber too: dragging it along its
            // edge — from the back pair's centre to the forward pair's —
            // maps linearly onto the strip's scroll range. Setting the
            // scroll fires the normal scroll handler, which repositions
            // the dot (and runs the end merges) as usual.
            let dotDragging = false;
            function scrubTo(e) {
                const horizontal = document.body.classList.contains("wide");
                const max = scrollMax();
                if (max <= 0) return;
                const dd = dot.offsetWidth;
                let c0, c1, p;
                if (horizontal) {
                    c0 = backGroup.offsetLeft + dd / 2;
                    c1 = fwdGroup.offsetLeft + fwdGroup.offsetWidth - dd / 2;
                    p = e.clientX;
                } else {
                    c0 = backGroup.offsetTop + dd / 2;
                    c1 = fwdGroup.offsetTop + fwdGroup.offsetHeight - dd / 2;
                    p = e.clientY;
                }
                const f = Math.max(0, Math.min(1, (p - c0) / (c1 - c0)));
                setScrollPos(f * max);
            }
            dot.addEventListener("pointerdown", (e) => {
                dotDragging = true;
                dot.setPointerCapture(e.pointerId);
                cancelAnimations();
                e.preventDefault();
                scrubTo(e);
            });
            dot.addEventListener("pointermove", (e) => {
                if (dotDragging) scrubTo(e);
            });
            dot.addEventListener("pointerup", () => { dotDragging = false; });
            dot.addEventListener("pointercancel", () => { dotDragging = false; });

            if (PORTFOLIO_IMAGES.length > 1 &&
                !window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
                setTimeout(() => {
                    if (!userScrolled) runNudge();
                }, 3000);
            }
        </script>
        <script src="/index.js"></script>
    </body>
</html>
