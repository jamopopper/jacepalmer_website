        <style>
            .gallery {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
                gap: calc(0.6rem + 0.5vw);
                margin: calc(0.6rem + 0.5vw) 0;
            }
            .gallery figure {
                margin: 0;
                padding: calc(0.5 * (0.6rem + 0.5vw));
                border: 1px solid var(--border);
                background: var(--hltxt);
            }
            .gallery img {
                width: 100%;
                height: auto;
                display: block;
            }
            .gallery figcaption {
                margin-top: calc(0.3rem + 0.25vw);
                color: var(--imtext);
                font-size: 0.9em;
            }
            nav a {
                margin-right: 1em;
            }
        </style>
