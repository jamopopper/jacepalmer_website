<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="color-scheme" content="dark" />
        <link rel="stylesheet" href="/photography.css" />
        <html prefix="og: https://ogp.me/ns#">
        <meta property="og:title" content="Jace Palmer — Photography"/>
        <meta property="og:type" content="website"/>
        <meta property="og:url" content="https://jacepalmer.net/photography.html" />
        <meta property="og:image" content="/images/jp_logo_small.png"/>
        <link rel="apple-touch-icon" sizes="57x57" href="/images/favicon.ico/apple-icon-57x57.png">
        <link rel="apple-touch-icon" sizes="60x60" href="/images/favicon.ico/apple-icon-60x60.png">
        <link rel="apple-touch-icon" sizes="72x72" href="/images/favicon.ico/apple-icon-72x72.png">
        <link rel="apple-touch-icon" sizes="76x76" href="/images/favicon.ico/apple-icon-76x76.png">
        <link rel="apple-touch-icon" sizes="114x114" href="/images/favicon.ico/apple-icon-114x114.png">
        <link rel="apple-touch-icon" sizes="120x120" href="/images/favicon.ico/apple-icon-120x120.png">
        <link rel="apple-touch-icon" sizes="144x144" href="/images/favicon.ico/apple-icon-144x144.png">
        <link rel="apple-touch-icon" sizes="152x152" href="/images/favicon.ico/apple-icon-152x152.png">
        <link rel="apple-touch-icon" sizes="180x180" href="/images/favicon.ico/apple-icon-180x180.png">
        <link rel="icon" type="image/png" sizes="192x192"  href="/images/favicon.ico/android-icon-192x192.png">
        <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon.ico/favicon-32x32.png">
        <link rel="icon" type="image/png" sizes="96x96" href="/images/favicon.ico/favicon-96x96.png">
        <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon.ico/favicon-16x16.png">
        <meta name="msapplication-TileColor" content="#ffffff">
        <meta name="msapplication-TileImage" content="/images.favicon.ico/ms-icon-144x144.png">
        <meta name="theme-color" content="#ffffff">
        <meta name="description" content="Photography by Jace Palmer">
        <title>Jace Palmer — Photography</title>
    </head>

    <body class="photography">
        <header class="topbar">
            <!-- Back to main page. Black logo PNG; CSS inverts it to white. -->
            <a class="pfp" href="/index.html" title="Back to main page">
                <img src="/images/jp_logo-01.png" alt="Back to main page"
                     onerror="this.remove();this.parentElement.classList.add('no-logo')" />
                <span aria-hidden="true">&#8592;</span>
            </a>
            <div class="contactbar">
                <a href="mailto:photo@jacepalmer.net">photo@jacepalmer.net</a>
                <a href="tel:+15415307472">(541) 530-7472</a>
            </div>
        </header>

        <main class="gallery" id="gallery" aria-label="Photo portfolio"></main>

        <!-- Scroll cues: fades on both edges of the strip, plus a pair of
             remote-style buttons at each end that shows while its fade
             does — fast-forward (double triangle) steps 80% of the screen,
             skip (triangle and bar) goes to that end of the strip. -->
        <div class="edgefade trail" aria-hidden="true"></div>
        <div class="edgefade lead" aria-hidden="true"></div>
        <div class="btngroup lead">
            <button class="scrollbtn skip" id="skipStart" type="button" aria-label="Go to first photo"><svg viewBox="0 0 64 64" aria-hidden="true" focusable="false"><path d="M8 15 L36 32 L8 49 Z"/><rect x="43" y="15" width="9" height="34"/></svg></button>
            <button class="scrollbtn step" id="scrollBack" type="button" aria-label="Scroll back"><svg viewBox="0 0 64 64" aria-hidden="true" focusable="false"><path d="M6 15 L27 32 L6 49 Z"/><path d="M30 15 L51 32 L30 49 Z"/></svg></button>
        </div>
        <div class="btngroup trail">
            <button class="scrollbtn step" id="scrollFwd" type="button" aria-label="Scroll forward"><svg viewBox="0 0 64 64" aria-hidden="true" focusable="false"><path d="M6 15 L27 32 L6 49 Z"/><path d="M30 15 L51 32 L30 49 Z"/></svg></button>
            <button class="scrollbtn skip" id="skipEnd" type="button" aria-label="Go to last photo"><svg viewBox="0 0 64 64" aria-hidden="true" focusable="false"><path d="M8 15 L36 32 L8 49 Z"/><rect x="43" y="15" width="9" height="34"/></svg></button>
        </div>

        <script>
            // ------------------------------------------------------------------
            // YOUR PORTFOLIO IMAGES GO HERE.
            // 1. Put your image files in /images/portfolio/ in the repo.
            // 2. List each filename below, in the order you want them shown
            //    (e.g. newest-taken first).
            //    Any web image format works: .jpg .jpeg .png .webp .gif
            // ------------------------------------------------------------------
            const PORTFOLIO_DIR = "/images/portfolio/";
            const PORTFOLIO_IMAGES = [
                // Ordered newest to oldest by file timestamp.
                "IMG_2474.jpeg",
                "IMG_2469.jpeg",
                "IMG_2471.jpeg",
                "IMG_2468.jpeg",
                "IMG_1917.jpeg",
                "IMG_1909.jpeg",
                "IMG_1906.jpeg",
                "IMG_1684.jpeg",
                "P1650044 7 Edited.jpeg",
                "P1650036 4 Edited.jpeg",
            ];

            const gallery = document.getElementById("gallery");

            function showEmpty(message) {
                const empty = document.createElement("div");
                empty.className = "slide endcard";
                empty.innerHTML = "<p>" + message + "</p>";
                gallery.appendChild(empty);
            }

            if (PORTFOLIO_IMAGES.length === 0) {
                showEmpty("Portfolio coming soon.");
            } else {
                for (const file of PORTFOLIO_IMAGES) {
                    const slide = document.createElement("div");
                    slide.className = "slide";
                    const img = document.createElement("img");
                    img.src = PORTFOLIO_DIR + file;
                    img.alt = file.replace(/[-_]/g, " ").replace(/\.[^.]+$/, "");
                    img.loading = "lazy";
                    slide.appendChild(img);
                    gallery.appendChild(slide);
                }
            }

            // Scroll direction follows the screen shape: wider screens scroll
            // horizontally, taller screens scroll vertically. Re-evaluated on
            // resize so rotating a phone/tablet just works. No platform
            // detection anywhere — wheel and touch both drive the native
            // scroll container on their own.
            function setOrientation() {
                document.body.classList.toggle("wide", window.innerWidth >= window.innerHeight);
                document.body.classList.toggle("tall", window.innerWidth < window.innerHeight);
            }
            window.addEventListener("resize", setOrientation);
            setOrientation();

            // Scroll cues. Fades sit on both edges of the strip, each with
            // an arrow button that shows while its fade does; clicking an
            // arrow smooth-scrolls the strip 80% of the screen. About 3s
            // after the page opens, the strip also nudges forward and back
            // once — skipped if the visitor has already started scrolling
            // or their system prefers reduced motion.
            const fade = document.querySelector(".edgefade.trail");
            const leadFade = document.querySelector(".edgefade.lead");
            const fwdBtn = document.getElementById("scrollFwd");
            const backBtn = document.getElementById("scrollBack");
            const skipFwdBtn = document.getElementById("skipEnd");
            const skipBackBtn = document.getElementById("skipStart");
            const fwdGroup = document.querySelector(".btngroup.trail");
            const backGroup = document.querySelector(".btngroup.lead");
            const SCROLL_MS = 1467; // nudge duration — 1.5x the original 2200ms pace
            const BUTTON_MS = 880; // button scrolls: same easing at 2.5x the nudge's speed
            let nudging = false;
            let userScrolled = false;

            function updateFade() {
                const horizontal = document.body.classList.contains("wide");
                const pos = horizontal ? gallery.scrollLeft : gallery.scrollTop;
                const max = horizontal
                    ? gallery.scrollWidth - gallery.clientWidth
                    : gallery.scrollHeight - gallery.clientHeight;
                const atEnd = max <= 0 || pos >= max - 2;
                const atStart = max <= 0 || pos <= 2;
                fade.classList.toggle("at-end", atEnd);
                leadFade.classList.toggle("at-start", atStart);
                fwdGroup.classList.toggle("off", atEnd);
                backGroup.classList.toggle("off", atStart);
                if (!nudging && pos > 4) userScrolled = true;
            }
            gallery.addEventListener("scroll", updateFade, { passive: true });
            window.addEventListener("resize", updateFade);
            updateFade();
            // Late-loading photos grow the strip after that first check,
            // when it can still measure zero overflow — re-check as each
            // photo lands so the fade is correct from the start.
            gallery.querySelectorAll("img").forEach((img) => {
                if (!img.complete) img.addEventListener("load", updateFade);
            });
            window.addEventListener("load", updateFade);

            // The nudge: the strip eases out and back symmetrically on one
            // clock — zero speed at the start, the peak, and the end.
            const easeInOut = (t) => t < 0.5
                ? 4 * t * t * t
                : 1 - Math.pow(-2 * t + 2, 3) / 2;
            let nudgeCancelled = false;
            function runNudge() {
                const horizontal = document.body.classList.contains("wide");
                const distance = 48;
                const duration = SCROLL_MS;
                const start = performance.now();
                nudging = true;
                nudgeCancelled = false;
                function finish() {
                    nudging = false;
                }
                function frame(now) {
                    if (nudgeCancelled) { finish(); return; }
                    const p = Math.min((now - start) / duration, 1);
                    const out = p < 0.5 ? easeInOut(p * 2) : easeInOut(2 - p * 2);
                    const pos = distance * out;
                    if (horizontal) gallery.scrollLeft = pos;
                    else gallery.scrollTop = pos;
                    if (p < 1) requestAnimationFrame(frame);
                    else finish();
                }
                requestAnimationFrame(frame);
            }
            // A real scroll attempt during an animation hands control over.
            let buttonAnim = null;
            function cancelAnimations() {
                nudgeCancelled = true;
                buttonAnim = null;
            }
            gallery.addEventListener("wheel", cancelAnimations, { passive: true });
            gallery.addEventListener("touchstart", cancelAnimations, { passive: true });

            // Arrow buttons: smooth-scroll 80% of the screen dimension in
            // the strip's direction, eased like the nudge over BUTTON_MS.
            function smoothScrollBy(delta) {
                cancelAnimations();
                const horizontal = document.body.classList.contains("wide");
                const from = horizontal ? gallery.scrollLeft : gallery.scrollTop;
                const max = horizontal
                    ? gallery.scrollWidth - gallery.clientWidth
                    : gallery.scrollHeight - gallery.clientHeight;
                const to = Math.max(0, Math.min(max, from + delta));
                if (to === from) return;
                const token = {};
                buttonAnim = token;
                const start = performance.now();
                function frame(now) {
                    if (buttonAnim !== token) return;
                    const p = Math.min((now - start) / BUTTON_MS, 1);
                    const value = from + (to - from) * easeInOut(p);
                    if (horizontal) gallery.scrollLeft = value;
                    else gallery.scrollTop = value;
                    if (p < 1) requestAnimationFrame(frame);
                    else buttonAnim = null;
                }
                requestAnimationFrame(frame);
            }
            function screenDelta(sign) {
                const horizontal = document.body.classList.contains("wide");
                return sign * 0.8 * (horizontal ? gallery.clientWidth : gallery.clientHeight);
            }
            fwdBtn.addEventListener("click", () => smoothScrollBy(screenDelta(1)));
            backBtn.addEventListener("click", () => smoothScrollBy(screenDelta(-1)));
            // Skip buttons ride the same animation to the strip's end —
            // the clamp in smoothScrollBy lands them exactly on it.
            skipFwdBtn.addEventListener("click", () => smoothScrollBy(Number.MAX_SAFE_INTEGER));
            skipBackBtn.addEventListener("click", () => smoothScrollBy(-Number.MAX_SAFE_INTEGER));

            if (PORTFOLIO_IMAGES.length > 1 &&
                !window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
                setTimeout(() => {
                    if (!userScrolled) runNudge();
                }, 3000);
            }
        </script>
        <script src="/index.js"></script>
    </body>
</html>
