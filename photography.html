<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />

        <link rel="stylesheet" href="/photography.css" />
        <html prefix="og: https://ogp.me/ns#">

    </head>

    <body class="photography">
        <header class="topbar">
            <!-- Back to main page. Black logo PNG; CSS inverts it to white. -->
            <a class="pfp" href="/index.html" title="Back to main page">
                <img src="/images/jp_logo-01.png" alt="Back to main page"
                     onerror="this.remove();this.parentElement.classList.add('no-logo')" />
                <span aria-hidden="true">&#8592;</span>
            </a>
            <div class="contactbar">
                <a href="mailto:photo@jacepalmer.net">photo@jacepalmer.net</a>
                <a href="tel:+15415307472">(541) 530-7472</a>
            </div>
        </header>

        <main class="gallery" id="gallery" aria-label="Photo portfolio"></main>

        <!-- Scroll cues: fades on both edges of the strip, always on, plus
             a pair of remote-style buttons at each end; nearing an end
             merges its pair into the progress dot. Each pair forms one
             split pill — fast-forward (double triangle) steps 80% of the
             screen, skip (triangle and bar) goes to that end — with the
             icons cut out of the pill. -->
        <div class="btngroup lead">
            <button class="scrollbtn skip" id="skipStart" type="button" aria-label="Go to first photo"><svg class="for-wide" viewBox="0 0 64 64" aria-hidden="true" focusable="false"><defs><mask id="m-skipStart-wide" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64"><path d="M64 0 L32 0 A32 32 0 0 0 32 64 L64 64 Z" fill="#fff"/><g fill="#000"><path d="M53.7 17.5 L29.9 32 L53.7 46.5 Z"/><rect x="16.3" y="17.5" width="7.6" height="28.9"/></g></mask></defs><rect width="64" height="64" fill="#fff" mask="url(#m-skipStart-wide)"/></svg><svg class="for-tall" viewBox="0 0 64 64" aria-hidden="true" focusable="false"><defs><mask id="m-skipStart-tall" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64"><path d="M64 64 L64 32 A32 32 0 0 0 0 32 L0 64 Z" fill="#fff"/><g fill="#000"><path d="M17.5 53.7 L32 29.9 L46.5 53.7 Z"/><rect x="17.5" y="16.3" width="28.9" height="7.6"/></g></mask></defs><rect width="64" height="64" fill="#fff" mask="url(#m-skipStart-tall)"/></svg></button>
            <button class="scrollbtn step" id="scrollBack" type="button" aria-label="Scroll back"><svg class="for-wide" viewBox="0 0 64 64" aria-hidden="true" focusable="false"><defs><mask id="m-scrollBack-wide" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64"><path d="M0 0 L32 0 A32 32 0 0 1 32 64 L0 64 Z" fill="#fff"/><g fill="#000"><path d="M48.1 17.5 L30.3 32 L48.1 46.5 Z"/><path d="M27.7 17.5 L9.9 32 L27.7 46.5 Z"/></g></mask></defs><rect width="64" height="64" fill="#fff" mask="url(#m-scrollBack-wide)"/></svg><svg class="for-tall" viewBox="0 0 64 64" aria-hidden="true" focusable="false"><defs><mask id="m-scrollBack-tall" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64"><path d="M0 0 L0 32 A32 32 0 0 0 64 32 L64 0 Z" fill="#fff"/><g fill="#000"><path d="M17.5 48.1 L32 30.3 L46.5 48.1 Z"/><path d="M17.5 27.7 L32 9.9 L46.5 27.7 Z"/></g></mask></defs><rect width="64" height="64" fill="#fff" mask="url(#m-scrollBack-tall)"/></svg></button>
        </div>
        <div class="btngroup trail">
            <button class="scrollbtn step" id="scrollFwd" type="button" aria-label="Scroll forward"><svg class="for-wide" viewBox="0 0 64 64" aria-hidden="true" focusable="false"><defs><mask id="m-scrollFwd-wide" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64"><path d="M64 0 L32 0 A32 32 0 0 0 32 64 L64 64 Z" fill="#fff"/><g fill="#000"><path d="M15.9 17.5 L33.7 32 L15.9 46.5 Z"/><path d="M36.3 17.5 L54.1 32 L36.3 46.5 Z"/></g></mask></defs><rect width="64" height="64" fill="#fff" mask="url(#m-scrollFwd-wide)"/></svg><svg class="for-tall" viewBox="0 0 64 64" aria-hidden="true" focusable="false"><defs><mask id="m-scrollFwd-tall" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64"><path d="M64 64 L64 32 A32 32 0 0 0 0 32 L0 64 Z" fill="#fff"/><g fill="#000"><path d="M46.5 15.9 L32 33.7 L17.5 15.9 Z"/><path d="M46.5 36.3 L32 54.1 L17.5 36.3 Z"/></g></mask></defs><rect width="64" height="64" fill="#fff" mask="url(#m-scrollFwd-tall)"/></svg></button>
            <button class="scrollbtn skip" id="skipEnd" type="button" aria-label="Go to last photo"><svg class="for-wide" viewBox="0 0 64 64" aria-hidden="true" focusable="false"><defs><mask id="m-skipEnd-wide" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64"><path d="M0 0 L32 0 A32 32 0 0 1 32 64 L0 64 Z" fill="#fff"/><g fill="#000"><path d="M10.3 17.5 L34.1 32 L10.3 46.5 Z"/><rect x="40" y="17.5" width="7.6" height="28.9"/></g></mask></defs><rect width="64" height="64" fill="#fff" mask="url(#m-skipEnd-wide)"/></svg><svg class="for-tall" viewBox="0 0 64 64" aria-hidden="true" focusable="false"><defs><mask id="m-skipEnd-tall" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64"><path d="M0 0 L0 32 A32 32 0 0 0 64 32 L64 0 Z" fill="#fff"/><g fill="#000"><path d="M46.5 10.3 L32 34.1 L17.5 10.3 Z"/><rect x="17.5" y="40" width="28.9" height="7.6"/></g></mask></defs><rect width="64" height="64" fill="#fff" mask="url(#m-skipEnd-tall)"/></svg></button>
        </div>

        <!-- Scroll progress dot: travels the edge between the two pill
             pairs as the strip scrolls. -->
        <div class="scrolldot" aria-hidden="true"></div>

        <script>
            // ------------------------------------------------------------------
            // YOUR PORTFOLIO IMAGES GO HERE.
            // 1. Put your image files in /images/portfolio/ in the repo.
            // 2. List each filename below, in the order you want them shown
            //    (e.g. newest-taken first).
            //    Any web image format works: .jpg .jpeg .png .webp .gif
            // ------------------------------------------------------------------
            const PORTFOLIO_DIR = "/images/portfolio/";
            const PORTFOLIO_IMAGES = [
                // Ordered newest to oldest by file timestamp.
                "IMG_2474.jpeg",
                "IMG_2469.jpeg",
                "IMG_2471.jpeg",
                "IMG_2468.jpeg",
                "IMG_1917.jpeg",
                "IMG_1909.jpeg",
                "IMG_1906.jpeg",
                "IMG_1684.jpeg",
                "IMG_1668.JPG",
                "IMG_1545.JPG",
                "IMG_1544.JPG",
                "IMG_1324.JPG",
                "IMG_1406.JPG",
                "IMG_1404.JPG",
                "IMG_1376.JPG",
                "P1760160 6 Edited.jpg",
                "IMG_0599 13 Edited.jpg",
                "IMG_0444 10 Edited.jpg",
                "IMG_0467 4 Edited.jpg",
                "P1740326 51 Edited.jpg",
                "P1740316 49 Edited.jpg",
                "P1740278 42 Edited.jpg",
                "P1740151 26 Edited.jpg",
                "P1730856 19 Edited.JPG",
                "P1730780 3 Edited.JPG",
                "P1730723 110 Edited.jpg",
                "P1730662 106 Edited.jpg",
                "P1730625 101 Edited.jpg",
                "P1730402 68 Edited.jpg",
                "P1730240 37 Edited.jpg",
                "P1730098 19 Edited.jpg",
                "P1730082 17 Edited.jpg",
                "P1730016 11 Edited.jpg",
                "P1650044 7 Edited.jpeg",
                "P1650036 4 Edited.jpeg",
            ];

            const gallery = document.getElementById("gallery");

            function showEmpty(message) {
                const empty = document.createElement("div");
                empty.className = "slide endcard";
                empty.innerHTML = "<p>" + message + "</p>";
                gallery.appendChild(empty);
            }

            if (PORTFOLIO_IMAGES.length === 0) {
                showEmpty("Portfolio coming soon.");
            } else {
                // The strip holds the photos; each photo carries two
                // backdrop canvases behind it. When a photo loads, it's
                // drawn into those canvases at a tiny size — the shrink
                // itself is most of the blur — and CSS stretches the
                // tiny result back up with a light finishing blur. The
                // phone only ever stretches a tiny texture instead of
                // filtering a full-size image, so scrolling stays smooth.
                const strip = document.createElement("div");
                strip.className = "strip";
                function paintHalo(canvas, img, width) {
                    canvas.width = width;
                    canvas.height = Math.max(1, Math.round(width * img.naturalHeight / img.naturalWidth));
                    const ctx = canvas.getContext("2d");
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    // Bake the crossfade into the bitmap itself: erase a
                    // ramp at each end of the scroll axis (full erase at
                    // the edge, none one gap-width in), so where two
                    // halos overlap in a gap their alphas sum to one and
                    // the colors dissolve into each other. Doing this in
                    // the image data — instead of a CSS mask, blend mode,
                    // or clip — keeps the effect on the plainest image
                    // compositing path, which is the one iOS Safari
                    // renders reliably inside a scroller.
                    const horizontal = document.body.classList.contains("wide");
                    const axisBitmap = horizontal ? canvas.width : canvas.height;
                    const axisClient = horizontal ? canvas.clientWidth : canvas.clientHeight;
                    if (!axisClient) return;
                    const ramp = Math.max(1, Math.round(14 * axisBitmap / axisClient));
                    ctx.globalCompositeOperation = "destination-out";
                    if (horizontal) {
                        let g = ctx.createLinearGradient(0, 0, ramp, 0);
                        g.addColorStop(0, "rgba(0,0,0,1)");
                        g.addColorStop(1, "rgba(0,0,0,0)");
                        ctx.fillStyle = g;
                        ctx.fillRect(0, 0, ramp, canvas.height);
                        g = ctx.createLinearGradient(canvas.width, 0, canvas.width - ramp, 0);
                        g.addColorStop(0, "rgba(0,0,0,1)");
                        g.addColorStop(1, "rgba(0,0,0,0)");
                        ctx.fillStyle = g;
                        ctx.fillRect(canvas.width - ramp, 0, ramp, canvas.height);
                    } else {
                        let g = ctx.createLinearGradient(0, 0, 0, ramp);
                        g.addColorStop(0, "rgba(0,0,0,1)");
                        g.addColorStop(1, "rgba(0,0,0,0)");
                        ctx.fillStyle = g;
                        ctx.fillRect(0, 0, canvas.width, ramp);
                        g = ctx.createLinearGradient(0, canvas.height, 0, canvas.height - ramp);
                        g.addColorStop(0, "rgba(0,0,0,1)");
                        g.addColorStop(1, "rgba(0,0,0,0)");
                        ctx.fillStyle = g;
                        ctx.fillRect(0, canvas.height - ramp, canvas.width, ramp);
                    }
                    ctx.globalCompositeOperation = "source-over";
                }
                // If the screen rotates, the baked ramps sit on the wrong
                // axis — repaint every loaded photo's halos on a flip.
                let lastWide = document.body.classList.contains("wide");
                window.addEventListener("resize", function () {
                    const nowWide = document.body.classList.contains("wide");
                    if (nowWide === lastWide) return;
                    lastWide = nowWide;
                    queue.forEach(function (entry) {
                        if (entry.img.complete && entry.img.naturalWidth > 0) {
                            paintHalo(entry.halo, entry.img, 64);
                            paintHalo(entry.blend, entry.img, 160);
                        }
                    });
                });
                const queue = [];
                for (const file of PORTFOLIO_IMAGES) {
                    const slide = document.createElement("div");
                    slide.className = "slide";
                    const img = document.createElement("img");
                    img.alt = file.replace(/[-_]/g, " ").replace(/\.[^.]+$/, "");
                    slide.appendChild(img);
                    const halo = document.createElement("canvas");
                    halo.className = "halo";
                    halo.setAttribute("aria-hidden", "true");
                    slide.appendChild(halo);
                    const blend = document.createElement("canvas");
                    blend.className = "halo blend";
                    blend.setAttribute("aria-hidden", "true");
                    slide.appendChild(blend);
                    strip.appendChild(slide);
                    queue.push({ img: img, file: file, halo: halo, blend: blend });
                }
                gallery.appendChild(strip);
                // Photos load in a small rolling window (a few in
                // flight, each finished load starting the next), so the
                // next section is ready a couple of screens before it's
                // reached instead of starting at the screen's edge.
                let nextUp = 0;
                let inFlight = 0;
                function pumpLoads() {
                    while (nextUp < queue.length && inFlight < 5) {
                        const entry = queue[nextUp++];
                        inFlight++;
                        let settled = false;
                        const settle = function () {
                            if (settled) return;
                            settled = true;
                            inFlight--;
                            pumpLoads();
                        };
                        entry.img.addEventListener("load", function () {
                            paintHalo(entry.halo, entry.img, 64);
                            paintHalo(entry.blend, entry.img, 160);
                            updateFade();
                            settle();
                        });
                        entry.img.addEventListener("error", settle);
                        entry.img.src = PORTFOLIO_DIR + entry.file;
                    }
                }
                pumpLoads();
            }

            // Scroll direction follows the screen shape: wider screens scroll
            // horizontally, taller screens scroll vertically. Re-evaluated on
            // resize so rotating a phone/tablet just works. No platform
            // detection anywhere — wheel and touch both drive the native
            // scroll container on their own.
            function setOrientation() {
                document.body.classList.toggle("wide", window.innerWidth >= window.innerHeight);
                document.body.classList.toggle("tall", window.innerWidth < window.innerHeight);
            }
            window.addEventListener("resize", setOrientation);
            setOrientation();

            // Scroll cues. Fades sit on both edges of the strip, always on;
            // at each end a pill pair merges into the progress dot as its
            // end is reached; clicking a pill button smooth-scrolls the
            // strip. About 3s after the page opens, the strip also nudges
            // forward and back once — skipped if the visitor has already
            // started scrolling or their system prefers reduced motion.
            const fwdBtn = document.getElementById("scrollFwd");
            const backBtn = document.getElementById("scrollBack");
            const skipFwdBtn = document.getElementById("skipEnd");
            const skipBackBtn = document.getElementById("skipStart");
            const fwdGroup = document.querySelector(".btngroup.trail");
            const backGroup = document.querySelector(".btngroup.lead");
            const dot = document.querySelector(".scrolldot");
            const SCROLL_MS = 1467; // nudge duration — 1.5x the original 2200ms pace
            const BUTTON_MS = 880; // button scrolls: same easing at 2.5x the nudge's speed
            let nudging = false;
            let userScrolled = false;

            function updateFade() {
                const horizontal = document.body.classList.contains("wide");
                const pos = horizontal ? gallery.scrollLeft : gallery.scrollTop;
                const max = horizontal
                    ? gallery.scrollWidth - gallery.clientWidth
                    : gallery.scrollHeight - gallery.clientHeight;
                // (The black edge fades were removed 2026-10-21 at
                // Jace's request — the blurred backdrop does that job.)
                // Pair/dot merge at the ends. In the last MERGE px of
                // scroll at either end, that end's pair fades out and
                // squishes toward its own centre (scale) while the dot
                // slides from its between-pairs track into that same
                // centre — one scroll-driven motion, so the pair reads as
                // collapsing into the dot, and reverses on the way back.
                // Mid-strip, the dot rides the edge between the pairs.
                function setPair(group, o) {
                    group.style.opacity = String(o);
                    group.style.transform = "scale(" + (0.55 + 0.45 * o) + ")";
                    group.style.pointerEvents = o <= 0.02 ? "none" : "";
                }
                if (max <= 0) {
                    setPair(backGroup, 0);
                    setPair(fwdGroup, 0);
                    dot.classList.add("off");
                } else {
                    const MERGE = Math.min(140, max * 0.25);
                    setPair(backGroup, Math.min(1, pos / MERGE));
                    setPair(fwdGroup, Math.min(1, (max - pos) / MERGE));
                    dot.classList.remove("off");
                    const d = dot.offsetWidth;
                    const bR = backGroup.getBoundingClientRect();
                    const fR = fwdGroup.getBoundingClientRect();
                    let v0, v1, v2, v3;
                    if (horizontal) {
                        v0 = bR.left + bR.width / 2 - d / 2;
                        v1 = bR.right + 8;
                        v2 = fR.left - 8 - d;
                        v3 = fR.left + fR.width / 2 - d / 2;
                    } else {
                        v0 = bR.top + bR.height / 2 - d / 2;
                        v1 = bR.bottom + 8;
                        v2 = fR.top - 8 - d;
                        v3 = fR.top + fR.height / 2 - d / 2;
                    }
                    let a;
                    if (pos <= MERGE) a = v0 + (v1 - v0) * (pos / MERGE);
                    else if (pos >= max - MERGE) a = v2 + (v3 - v2) * ((pos - (max - MERGE)) / MERGE);
                    else a = v1 + (v2 - v1) * ((pos - MERGE) / (max - 2 * MERGE));
                    if (horizontal) { dot.style.left = a + "px"; dot.style.top = ""; }
                    else { dot.style.top = a + "px"; dot.style.left = ""; }
                }
                if (!nudging && pos > 4) userScrolled = true;
            }
            gallery.addEventListener("scroll", updateFade, { passive: true });
            window.addEventListener("resize", updateFade);
            updateFade();
            // Late-loading photos grow the strip after that first check,
            // when it can still measure zero overflow — re-check as each
            // photo lands so the fade is correct from the start.
            gallery.querySelectorAll("img").forEach((img) => {
                if (!img.complete) img.addEventListener("load", updateFade);
            });
            window.addEventListener("load", updateFade);

            // The nudge: the strip eases out and back symmetrically on one
            // clock — zero speed at the start, the peak, and the end.
            const easeInOut = (t) => t < 0.5
                ? 4 * t * t * t
                : 1 - Math.pow(-2 * t + 2, 3) / 2;
            let nudgeCancelled = false;
            function runNudge() {
                const horizontal = document.body.classList.contains("wide");
                const distance = 48;
                const duration = SCROLL_MS;
                const start = performance.now();
                nudging = true;
                nudgeCancelled = false;
                function finish() {
                    nudging = false;
                }
                function frame(now) {
                    if (nudgeCancelled) { finish(); return; }
                    const p = Math.min((now - start) / duration, 1);
                    const out = p < 0.5 ? easeInOut(p * 2) : easeInOut(2 - p * 2);
                    const pos = distance * out;
                    if (horizontal) gallery.scrollLeft = pos;
                    else gallery.scrollTop = pos;
                    if (p < 1) requestAnimationFrame(frame);
                    else finish();
                }
                requestAnimationFrame(frame);
            }
            // A real scroll attempt during an animation hands control over.
            let buttonAnim = null;
            function cancelAnimations() {
                nudgeCancelled = true;
                buttonAnim = null;
            }
            gallery.addEventListener("wheel", cancelAnimations, { passive: true });
            gallery.addEventListener("touchstart", cancelAnimations, { passive: true });

            // Arrow buttons: smooth-scroll 80% of the screen dimension in
            // the strip's direction, eased like the nudge over BUTTON_MS.
            function smoothScrollBy(delta) {
                cancelAnimations();
                const horizontal = document.body.classList.contains("wide");
                const from = horizontal ? gallery.scrollLeft : gallery.scrollTop;
                const max = horizontal
                    ? gallery.scrollWidth - gallery.clientWidth
                    : gallery.scrollHeight - gallery.clientHeight;
                const to = Math.max(0, Math.min(max, from + delta));
                if (to === from) return;
                const token = {};
                buttonAnim = token;
                const start = performance.now();
                function frame(now) {
                    if (buttonAnim !== token) return;
                    const p = Math.min((now - start) / BUTTON_MS, 1);
                    const value = from + (to - from) * easeInOut(p);
                    if (horizontal) gallery.scrollLeft = value;
                    else gallery.scrollTop = value;
                    if (p < 1) requestAnimationFrame(frame);
                    else buttonAnim = null;
                }
                requestAnimationFrame(frame);
            }
            function screenDelta(sign) {
                const horizontal = document.body.classList.contains("wide");
                return sign * 0.8 * (horizontal ? gallery.clientWidth : gallery.clientHeight);
            }
            fwdBtn.addEventListener("click", () => smoothScrollBy(screenDelta(1)));
            backBtn.addEventListener("click", () => smoothScrollBy(screenDelta(-1)));
            // Skip buttons ride the same animation to the strip's end —
            // the clamp in smoothScrollBy lands them exactly on it.
            skipFwdBtn.addEventListener("click", () => smoothScrollBy(Number.MAX_SAFE_INTEGER));
            skipBackBtn.addEventListener("click", () => smoothScrollBy(-Number.MAX_SAFE_INTEGER));

            // The progress dot is a scrubber too: dragging it along its
            // edge — from the back pair's centre to the forward pair's —
            // maps linearly onto the strip's scroll range. Setting the
            // scroll fires the normal scroll handler, which repositions
            // the dot (and runs the end merges) as usual.
            let dotDragging = false;
            function scrubTo(e) {
                const horizontal = document.body.classList.contains("wide");
                const max = horizontal
                    ? gallery.scrollWidth - gallery.clientWidth
                    : gallery.scrollHeight - gallery.clientHeight;
                if (max <= 0) return;
                const bR = backGroup.getBoundingClientRect();
                const fR = fwdGroup.getBoundingClientRect();
                let c0, c1, p;
                if (horizontal) {
                    c0 = bR.left + bR.width / 2;
                    c1 = fR.left + fR.width / 2;
                    p = e.clientX;
                } else {
                    c0 = bR.top + bR.height / 2;
                    c1 = fR.top + fR.height / 2;
                    p = e.clientY;
                }
                const f = Math.max(0, Math.min(1, (p - c0) / (c1 - c0)));
                if (horizontal) gallery.scrollLeft = f * max;
                else gallery.scrollTop = f * max;
            }
            dot.addEventListener("pointerdown", (e) => {
                dotDragging = true;
                dot.setPointerCapture(e.pointerId);
                cancelAnimations();
                e.preventDefault();
                scrubTo(e);
            });
            dot.addEventListener("pointermove", (e) => {
                if (dotDragging) scrubTo(e);
            });
            dot.addEventListener("pointerup", () => { dotDragging = false; });
            dot.addEventListener("pointercancel", () => { dotDragging = false; });

            if (PORTFOLIO_IMAGES.length > 1 &&
                !window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
                setTimeout(() => {
                    if (!userScrolled) runNudge();
                }, 3000);
            }
        </script>
        <script src="/index.js"></script>
    </body>
</html>
