<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="color-scheme" content="light dark" />
        <link rel="stylesheet" href="/index.css" />
        <style>
            html, body {
                margin: 0;
                padding: 0;
                height: 100%;
                overflow: hidden; /* the gallery handles all scrolling */
            }

            /* Back-to-main: circle profile picture, top left */
            .pfp {
                position: fixed;
                top: 1rem;
                left: 1rem;
                z-index: 10;
                display: block;
                width: 56px;
                height: 56px;
                border-radius: 50%;
                overflow: hidden;
                border: 2px solid var(--border, #888);
                background: var(--hltxt, #222);
                color: inherit;
                text-decoration: none;
                font-size: 1.4rem;
                line-height: 52px;
                text-align: center;
            }
            .pfp img {
                width: 100%;
                height: 100%;
                object-fit: cover;
                display: block;
            }

            /* Full-viewport scroller. Direction is set by body.wide / body.tall. */
            .gallery {
                display: flex;
                width: 100vw;
                height: 100dvh;
                scroll-snap-type: both mandatory;
            }
            body.wide .gallery {
                flex-direction: row;
                overflow-x: auto;
                overflow-y: hidden;
            }
            body.tall .gallery {
                flex-direction: column;
                overflow-x: hidden;
                overflow-y: auto;
            }

            .slide {
                flex: 0 0 auto;
                scroll-snap-align: center;
                display: grid;
                place-items: center;
                box-sizing: border-box;
                padding: 1rem;
            }
            body.wide .slide {
                width: 100vw;
                height: 100dvh;
            }
            body.tall .slide {
                width: 100vw;
                height: 100dvh;
            }
            .slide img {
                max-width: 100%;
                max-height: 100%;
                object-fit: contain;
                display: block;
            }
            .slide.endcard {
                font-size: 1.1rem;
                text-align: center;
            }
            .slide.endcard a {
                color: inherit;
            }
        </style>
        <html prefix="og: https://ogp.me/ns#">
        <meta property="og:title" content="Jace Palmer — Photography"/>
        <meta property="og:type" content="website"/>
        <meta property="og:url" content="https://jacepalmer.net/photography.html" />
        <meta property="og:image" content="/images/jp_logo_small.png"/>
        <link rel="apple-touch-icon" sizes="57x57" href="/images/favicon.ico/apple-icon-57x57.png">
        <link rel="apple-touch-icon" sizes="60x60" href="/images/favicon.ico/apple-icon-60x60.png">
        <link rel="apple-touch-icon" sizes="72x72" href="/images/favicon.ico/apple-icon-72x72.png">
        <link rel="apple-touch-icon" sizes="76x76" href="/images/favicon.ico/apple-icon-76x76.png">
        <link rel="apple-touch-icon" sizes="114x114" href="/images/favicon.ico/apple-icon-114x114.png">
        <link rel="apple-touch-icon" sizes="120x120" href="/images/favicon.ico/apple-icon-120x120.png">
        <link rel="apple-touch-icon" sizes="144x144" href="/images/favicon.ico/apple-icon-144x144.png">
        <link rel="apple-touch-icon" sizes="152x152" href="/images/favicon.ico/apple-icon-152x152.png">
        <link rel="apple-touch-icon" sizes="180x180" href="/images/favicon.ico/apple-icon-180x180.png">
        <link rel="icon" type="image/png" sizes="192x192"  href="/images/favicon.ico/android-icon-192x192.png">
        <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon.ico/favicon-32x32.png">
        <link rel="icon" type="image/png" sizes="96x96" href="/images/favicon.ico/favicon-96x96.png">
        <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon.ico/favicon-16x16.png">
        <meta name="msapplication-TileColor" content="#ffffff">
        <meta name="msapplication-TileImage" content="/images.favicon.ico/ms-icon-144x144.png">
        <meta name="theme-color" content="#ffffff">
        <meta name="description" content="Photography by Jace Palmer">
        <title>Jace Palmer — Photography</title>
    </head>

    <body>
        <!-- Back to main page. Put your profile picture at /images/pfp.jpg -->
        <a class="pfp" href="/index.html" title="Back to main page">
            <img src="/images/pfp.jpg" alt="Back to main page"
                 onerror="this.remove()" />
            <span aria-hidden="true">&#8592;</span>
        </a>

        <main class="gallery" id="gallery" aria-label="Photo portfolio"></main>

        <script>
            // ------------------------------------------------------------------
            // YOUR PORTFOLIO IMAGES GO HERE.
            // 1. Put your image files in /images/portfolio/ in the repo.
            // 2. List each filename below, in the order you want them shown.
            //    Any web image format works: .jpg .jpeg .png .webp .gif
            // ------------------------------------------------------------------
            const PORTFOLIO_DIR = "/images/portfolio/";
            const PORTFOLIO_IMAGES = [
                // "photo-01.jpg",
                // "photo-02.jpg",
            ];

            const gallery = document.getElementById("gallery");

            if (PORTFOLIO_IMAGES.length === 0) {
                const empty = document.createElement("div");
                empty.className = "slide endcard";
                empty.innerHTML = "<p>Portfolio coming soon.</p>";
                gallery.appendChild(empty);
            } else {
                for (const file of PORTFOLIO_IMAGES) {
                    const slide = document.createElement("div");
                    slide.className = "slide";
                    const img = document.createElement("img");
                    img.src = PORTFOLIO_DIR + file;
                    img.alt = file.replace(/[-_]/g, " ").replace(/\.[^.]+$/, "");
                    img.loading = "lazy";
                    slide.appendChild(img);
                    gallery.appendChild(slide);
                }
            }

            // Contact card as the final slide.
            const end = document.createElement("div");
            end.className = "slide endcard";
            end.innerHTML =
                '<p>Want prints or a shoot?<br>Email <a href="mailto:photo@jacepalmer.net">photo@jacepalmer.net</a></p>';
            gallery.appendChild(end);

            // Scroll direction follows the screen shape: wider screens scroll
            // horizontally, taller screens scroll vertically. Re-evaluated on
            // resize so rotating a phone/tablet just works. No platform
            // detection anywhere — wheel and touch both drive the native
            // scroll container on their own.
            function setOrientation() {
                document.body.classList.toggle("wide", window.innerWidth >= window.innerHeight);
                document.body.classList.toggle("tall", window.innerWidth < window.innerHeight);
            }
            window.addEventListener("resize", setOrientation);
            setOrientation();
        </script>
        <script src="/index.js"></script>
    </body>
</html>
