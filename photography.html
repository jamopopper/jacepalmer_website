<html lang="en">

        <meta property="og:type" content="website"/>
        <meta property="og:url" content="https://jacepalmer.net/photography.html" />
        <meta property="og:image" content="/images/jp_logo_small.png"/>

        <link rel="apple-touch-icon" sizes="60x60" href="/images/favicon.ico/apple-icon-60x60.png">

        <link rel="apple-touch-icon" sizes="76x76" href="/images/favicon.ico/apple-icon-76x76.png">
        <link rel="apple-touch-icon" sizes="114x114" href="/images/favicon.ico/apple-icon-114x114.png">
        <link rel="apple-touch-icon" sizes="120x120" href="/images/favicon.ico/apple-icon-120x120.png">
        <link rel="apple-touch-icon" sizes="144x144" href="/images/favicon.ico/apple-icon-144x144.png">
        <link rel="apple-touch-icon" sizes="152x152" href="/images/favicon.ico/apple-icon-152x152.png">
        <link rel="apple-touch-icon" sizes="180x180" href="/images/favicon.ico/apple-icon-180x180.png">
        <link rel="icon" type="image/png" sizes="192x192"  href="/images/favicon.ico/android-icon-192x192.png">
        <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon.ico/favicon-32x32.png">
        <link rel="icon" type="image/png" sizes="96x96" href="/images/favicon.ico/favicon-96x96.png">
        <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon.ico/favicon-16x16.png">
        <meta name="msapplication-TileColor" content="#ffffff">
        <meta name="msapplication-TileImage" content="/images.favicon.ico/ms-icon-144x144.png">
        <meta name="theme-color" content="#ffffff">
        <meta name="description" content="Photography by Jace Palmer">
        <title>Jace Palmer — Photography</title>
    </head>

    <body class="photography">
        <header class="topbar">
            <!-- Back to main page. Black logo; CSS inverts it to white in light mode. -->
            <a class="pfp" href="/index.html" title="Back to main page">
                <img src="/images/jp_logo-01.png" alt="Back to main page"
                     onerror="this.remove();this.parentElement.classList.add('no-logo')" />
                <span aria-hidden="true">&#8592;</span>
            </a>
            <div class="contactbar">
                <a href="mailto:photo@jacepalmer.net">photo@jacepalmer.net</a>
                <a href="tel:+15415307472">(541) 530-7472</a>
            </div>
        </header>

        <main class="gallery" id="gallery" aria-label="Photo portfolio"></main>

        <!-- Scroll cues: a permanent fade on the trailing edge, plus an arrow
             that shows only during the load nudge. Neither takes clicks. -->
        <div class="edgefade trail" aria-hidden="true"></div>
        <div class="edgefade lead" aria-hidden="true"></div>
        <div class="scrollhint" aria-hidden="true">&#8595;</div>

        <script>
            // ------------------------------------------------------------------
            // YOUR PORTFOLIO IMAGES GO HERE.
            // 1. Put your image files in /images/portfolio/ in the repo.
            // 2. List each filename below, in the order you want them shown
            //    (e.g. newest-taken first).
            //    Any web image format works: .jpg .jpeg .png .webp .gif
            // ------------------------------------------------------------------
            const PORTFOLIO_DIR = "/images/portfolio/";
            const PORTFOLIO_IMAGES = [
                // Ordered newest to oldest by file timestamp.
                "IMG_2474.jpeg",
                "IMG_2469.jpeg",
                "IMG_2471.jpeg",
                "IMG_2468.jpeg",
                "IMG_1917.jpeg",
                "IMG_1909.jpeg",
                "IMG_1906.jpeg",
                "IMG_1684.jpeg",
                "P1650044 7 Edited.jpeg",
                "P1650036 4 Edited.jpeg",
            ];

            const gallery = document.getElementById("gallery");

            function showEmpty(message) {
                const empty = document.createElement("div");
                empty.className = "slide endcard";
                empty.innerHTML = "<p>" + message + "</p>";
                gallery.appendChild(empty);
            }

            if (PORTFOLIO_IMAGES.length === 0) {
                showEmpty("Portfolio coming soon.");
            } else {
                for (const file of PORTFOLIO_IMAGES) {
                    const slide = document.createElement("div");
                    slide.className = "slide";
                    const img = document.createElement("img");
                    img.src = PORTFOLIO_DIR + file;
                    img.alt = file.replace(/[-_]/g, " ").replace(/\.[^.]+$/, "");
                    img.loading = "lazy";
                    slide.appendChild(img);
                    gallery.appendChild(slide);
                }
            }

            // Scroll direction follows the screen shape: wider screens scroll
            // horizontally, taller screens scroll vertically. Re-evaluated on
            // resize so rotating a phone/tablet just works. No platform
            // detection anywhere — wheel and touch both drive the native
            // scroll container on their own.
            function setOrientation() {
                document.body.classList.toggle("wide", window.innerWidth >= window.innerHeight);
                document.body.classList.toggle("tall", window.innerWidth < window.innerHeight);
            }
            window.addEventListener("resize", setOrientation);
            setOrientation();

            // Scroll cues. A fade sits on the trailing edge for as long as
            // there's more strip past it. About 3s after the page opens,
            // the strip nudges forward and back once while an arrow shows —
            // skipped if the visitor has already started scrolling or their
            // system prefers reduced motion.
            const fade = document.querySelector(".edgefade.trail");
            const hint = document.querySelector(".scrollhint");
            let nudging = false;
            let userScrolled = false;

            function updateFade() {
                const horizontal = document.body.classList.contains("wide");
                const pos = horizontal ? gallery.scrollLeft : gallery.scrollTop;
                const max = horizontal
                    ? gallery.scrollWidth - gallery.clientWidth
                    : gallery.scrollHeight - gallery.clientHeight;
                fade.classList.toggle("at-end", max <= 0 || pos >= max - 2);
                if (!nudging && pos > 4) userScrolled = true;
            }
            gallery.addEventListener("scroll", updateFade, { passive: true });
            window.addEventListener("resize", updateFade);
            updateFade();
            // Late-loading photos grow the strip after that first check,
            // when it can still measure zero overflow — re-check as each
            // photo lands so the fade is correct from the start.
            gallery.querySelectorAll("img").forEach((img) => {
                if (!img.complete) img.addEventListener("load", updateFade);
            });
            window.addEventListener("load", updateFade);

            // Ease the strip out and back by hand — the native smooth
            // scroll covers this distance too quickly and reads as a snap.
            function animateScroll(to, duration, done) {
                const horizontal = document.body.classList.contains("wide");
                const from = horizontal ? gallery.scrollLeft : gallery.scrollTop;
                const start = performance.now();
                function frame(now) {
                    const t = Math.min((now - start) / duration, 1);
                    const eased = t < 0.5
                        ? 4 * t * t * t
                        : 1 - Math.pow(-2 * t + 2, 3) / 2;
                    const value = from + (to - from) * eased;
                    if (horizontal) gallery.scrollLeft = value;
                    else gallery.scrollTop = value;
                    if (t < 1) requestAnimationFrame(frame);
                    else if (done) done();
                }
                requestAnimationFrame(frame);
            }

            if (PORTFOLIO_IMAGES.length > 1 &&
                !window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
                setTimeout(() => {
                    if (userScrolled) return;
                    nudging = true;
                    hint.classList.add("show");
                    animateScroll(48, 1000, () => {
                        setTimeout(() => {
                            animateScroll(0, 1000, () => {
                                hint.classList.remove("show");
                                nudging = false;
                            });
                        }, 250);
                    });
                }, 3000);
            }
        </script>
        <script src="/index.js"></script>
    </body>
</html>
