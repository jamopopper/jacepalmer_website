        <div class="btngroup lead">
            <button class="scrollbtn skip" id="skipStart" type="button" aria-label="Go to first photo"><svg class="for-wide" viewBox="0 0 64 64" aria-hidden="true" focusable="false"><defs><mask id="m-skipStart-wide" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64"><path d="M64 0 L32 0 A32 32 0 0 0 32 64 L64 64 Z" fill="#fff"/><g fill="#000"><path d="M53.7 17.5 L29.9 32 L53.7 46.5 Z"/><rect x="16.3" y="17.5" width="7.6" height="28.9"/></g></mask></defs><rect width="64" height="64" fill="#fff" mask="url(#m-skipStart-wide)"/></svg><svg class="for-tall" viewBox="0 0 64 64" aria-hidden="true" focusable="false"><defs><mask id="m-skipStart-tall" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64"><path d="M64 64 L64 32 A32 32 0 0 0 0 32 L0 64 Z" fill="#fff"/><g fill="#000"><path d="M17.5 53.7 L32 29.9 L46.5 53.7 Z"/><rect x="17.5" y="16.3" width="28.9" height="7.6"/></g></mask></defs><rect width="64" height="64" fill="#fff" mask="url(#m-skipStart-tall)"/></svg></button>

        <div class="btngroup trail">
            <button class="scrollbtn step" id="scrollFwd" type="button" aria-label="Scroll forward"><svg class="for-wide" viewBox="0 0 64 64" aria-hidden="true" focusable="false"><defs><mask id="m-scrollFwd-wide" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64"><path d="M64 0 L32 0 A32 32 0 0 0 32 64 L64 64 Z" fill="#fff"/><g fill="#000"><path d="M15.9 17.5 L33.7 32 L15.9 46.5 Z"/><path d="M36.3 17.5 L54.1 32 L36.3 46.5 Z"/></g></mask></defs><rect width="64" height="64" fill="#fff" mask="url(#m-scrollFwd-wide)"/></svg><svg class="for-tall" viewBox="0 0 64 64" aria-hidden="true" focusable="false"><defs><mask id="m-scrollFwd-tall" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64"><path d="M64 64 L64 32 A32 32 0 0 0 0 32 L0 64 Z" fill="#fff"/><g fill="#000"><path d="M46.5 15.9 L32 33.7 L17.5 15.9 Z"/><path d="M46.5 36.3 L32 54.1 L17.5 36.3 Z"/></g></mask></defs><rect width="64" height="64" fill="#fff" mask="url(#m-scrollFwd-tall)"/></svg></button>
            <button class="scrollbtn skip" id="skipEnd" type="button" aria-label="Go to last photo"><svg class="for-wide" viewBox="0 0 64 64" aria-hidden="true" focusable="false"><defs><mask id="m-skipEnd-wide" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64"><path d="M0 0 L32 0 A32 32 0 0 1 32 64 L0 64 Z" fill="#fff"/><g fill="#000"><path d="M10.3 17.5 L34.1 32 L10.3 46.5 Z"/><rect x="40" y="17.5" width="7.6" height="28.9"/></g></mask></defs><rect width="64" height="64" fill="#fff" mask="url(#m-skipEnd-wide)"/></svg><svg class="for-tall" viewBox="0 0 64 64" aria-hidden="true" focusable="false"><defs><mask id="m-skipEnd-tall" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64"><path d="M0 0 L0 32 A32 32 0 0 0 64 32 L64 0 Z" fill="#fff"/><g fill="#000"><path d="M46.5 10.3 L32 34.1 L17.5 10.3 Z"/><rect x="17.5" y="40" width="28.9" height="7.6"/></g></mask></defs><rect width="64" height="64" fill="#fff" mask="url(#m-skipEnd-tall)"/></svg></button>

        <script>

            const PORTFOLIO_DIR = "/images/portfolio/";
            const PORTFOLIO_IMAGES = [

            ];

            const PORTFOLIO_DIMS = {
                "IMG_2474.jpeg": [3730, 4974],
                "IMG_2469.jpeg": [3825, 5100],
                "IMG_2471.jpeg": [3888, 5184],
                "IMG_2468.jpeg": [3888, 5184],
                "IMG_1917.jpeg": [5184, 3888],
                "IMG_1909.jpeg": [5184, 3888],
                "IMG_1906.jpeg": [5184, 3888],
                "IMG_1684.jpeg": [5105, 3829],
                "IMG_1668.JPG": [3888, 5184],
                "IMG_1545.JPG": [6888, 5172],
                "IMG_1544.JPG": [5172, 6888],
                "IMG_1324.JPG": [6888, 5172],
                "IMG_1406.JPG": [6858, 5149],
                "IMG_1404.JPG": [6888, 5172],
                "IMG_1376.JPG": [6549, 4917],
                "P1760160 6 Edited.jpg": [4592, 3448],
                "IMG_0599 13 Edited.jpg": [4592, 3448],
                "IMG_0444 10 Edited.jpg": [4592, 3448],
                "IMG_0467 4 Edited.jpg": [4592, 3448],
                "P1740326 51 Edited.jpg": [4592, 3448],
                "P1740316 49 Edited.jpg": [4592, 3448],
                "P1740278 42 Edited.jpg": [4592, 3448],
                "P1740151 26 Edited.jpg": [4592, 3448],
                "P1730856 19 Edited.JPG": [3448, 4592],
                "P1730780 3 Edited.JPG": [3448, 4592],
                "P1730723 110 Edited.jpg": [4134, 1757],
                "P1730662 106 Edited.jpg": [4592, 3448],
                "P1730625 101 Edited.jpg": [3753, 2818],
                "P1730402 68 Edited.jpg": [4592, 3448],
                "P1730240 37 Edited.jpg": [3448, 4592],
                "P1730098 19 Edited.jpg": [3448, 4592],
                "P1730082 17 Edited.jpg": [4592, 3448],
                "P1730016 11 Edited.jpg": [4592, 3448],
                "P1650044 7 Edited.jpeg": [4592, 3448],
                "P1650036 4 Edited.jpeg": [4592, 3448],
            };

            const gallery = document.getElementById("gallery");

            const scroller = document.documentElement;
            function scrollPos() {
                return document.body.classList.contains("wide") ? window.scrollX : window.scrollY;
            }
            function scrollMax() {
                return document.body.classList.contains("wide")
                    ? scroller.scrollWidth - window.innerWidth
                    : scroller.scrollHeight - window.innerHeight;
            }
            function setScrollPos(v) {
                if (document.body.classList.contains("wide")) scroller.scrollLeft = v;
                else scroller.scrollTop = v;
            }

            function showEmpty(message) {
                const empty = document.createElement("div");
                empty.className = "slide endcard";
                empty.innerHTML = "<p>" + message + "</p>";
                gallery.appendChild(empty);
            }

            if (PORTFOLIO_IMAGES.length === 0) {
                showEmpty("Portfolio coming soon.");
            } else {

                const strip = document.createElement("div");
                strip.className = "strip";
                const queue = [];
                for (const file of PORTFOLIO_IMAGES) {
                    const slide = document.createElement("div");
                    slide.className = "slide";
                    const img = document.createElement("img");
                    img.alt = file.replace(/[-_]/g, " ").replace(/\.[^.]+$/, "");
                    const dims = PORTFOLIO_DIMS[file];
                    if (dims) {

                        img.style.aspectRatio = dims[0] + " / " + dims[1];
                        img.style.opacity = "0";
                    }
                    slide.appendChild(img);
                    strip.appendChild(slide);
                    queue.push({ img: img, file: file });
                }
                gallery.appendChild(strip);

                let nextUp = 0;
                let inFlight = 0;
                function pumpLoads() {
                    while (nextUp < queue.length && inFlight < 5) {
                        const entry = queue[nextUp++];
                        inFlight++;
                        let settled = false;
                        const settle = function () {
                            if (settled) return;
                            settled = true;
                            inFlight--;
                            pumpLoads();
                        };
                        entry.img.addEventListener("load", function () {
                            entry.img.style.opacity = "";
                            requestRefresh();
                            settle();
                        });
                        entry.img.addEventListener("error", function () {
                            entry.img.style.opacity = "";
                            settle();
                        });
                        entry.img.src = PORTFOLIO_DIR + entry.file;
                    }
                }
                pumpLoads();
            }

            function setOrientation() {
                document.body.classList.toggle("wide", window.innerWidth >= window.innerHeight);
                document.body.classList.toggle("tall", window.innerWidth < window.innerHeight);
            }
            window.addEventListener("resize", setOrientation);
            setOrientation();

            const fwdBtn = document.getElementById("scrollFwd");
            const backBtn = document.getElementById("scrollBack");
            const skipFwdBtn = document.getElementById("skipEnd");
            const skipBackBtn = document.getElementById("skipStart");
            const fwdGroup = document.querySelector(".btngroup.trail");
            const backGroup = document.querySelector(".btngroup.lead");
            const SCROLL_MS = 1467;
            const BUTTON_MS = 880;
            let nudging = false;
            let userScrolled = false;

            let geom = null;
            function measureGeom() {
                geom = {
                    horizontal: document.body.classList.contains("wide"),
                    max: scrollMax()
                };
            }
            function refreshFade() {
                measureGeom();
                updateFade();
            }

            function requestRefresh() {
                if (fadeRaf === null) refreshFade();
                else updateFade();
            }

            function updateFade() {
                const horizontal = document.body.classList.contains("wide");
                if (!geom || geom.horizontal !== horizontal) measureGeom();
                const pos = scrollPos();
                const max = geom.max;

                function setPair(group, o) {
                    group.style.opacity = String(o);
                    group.style.transform = "scale(" + (0.55 + 0.45 * o) + ")";
                    group.style.pointerEvents = o <= 0.02 ? "none" : "";
                }
                if (max <= 0) {
                    setPair(backGroup, 0);
                    setPair(fwdGroup, 0);
                } else {
                    const MERGE = Math.min(140, max * 0.25);
                    setPair(backGroup, Math.min(1, pos / MERGE));
                    setPair(fwdGroup, Math.min(1, (max - pos) / MERGE));
                }
                if (!nudging && pos > 4) userScrolled = true;
            }

            let fadeRaf = null;
            function requestFade() {
                if (fadeRaf !== null) return;
                let lastPos = null;
                let settled = 0;
                function step() {
                    fadeRaf = null;
                    updateFade();
                    const p = scrollPos();
                    if (p === lastPos) settled++;
                    else { settled = 0; lastPos = p; }
                    if (settled < 2) fadeRaf = requestAnimationFrame(step);

                    else refreshFade();
                }
                fadeRaf = requestAnimationFrame(step);
            }
            window.addEventListener("scroll", requestFade, { passive: true });
            window.addEventListener("resize", requestRefresh);
            refreshFade();

            gallery.querySelectorAll("img").forEach((img) => {
                if (!img.complete) img.addEventListener("load", requestRefresh);
            });
            window.addEventListener("load", requestRefresh);

            const easeInOut = (t) => t < 0.5
                ? 4 * t * t * t
                : 1 - Math.pow(-2 * t + 2, 3) / 2;
            let nudgeCancelled = false;
            function runNudge() {
                const distance = 48;
                const duration = SCROLL_MS;
                const start = performance.now();
                nudging = true;
                nudgeCancelled = false;
                function finish() {
                    nudging = false;
                }
                function frame(now) {
                    if (nudgeCancelled) { finish(); return; }
                    const p = Math.min((now - start) / duration, 1);
                    const out = p < 0.5 ? easeInOut(p * 2) : easeInOut(2 - p * 2);
                    setScrollPos(distance * out);
                    if (p < 1) requestAnimationFrame(frame);
                    else finish();
                }
                requestAnimationFrame(frame);
            }

            let buttonAnim = null;
            function cancelAnimations() {
                nudgeCancelled = true;
                buttonAnim = null;
            }
            window.addEventListener("wheel", cancelAnimations, { passive: true });
            window.addEventListener("touchstart", cancelAnimations, { passive: true });

            function smoothScrollBy(delta) {
                cancelAnimations();
                const from = scrollPos();
                const max = scrollMax();
                const to = Math.max(0, Math.min(max, from + delta));
                if (to === from) return;
                const token = {};
                buttonAnim = token;
                const start = performance.now();
                function frame(now) {
                    if (buttonAnim !== token) return;
                    const p = Math.min((now - start) / BUTTON_MS, 1);
                    setScrollPos(from + (to - from) * easeInOut(p));
                    if (p < 1) requestAnimationFrame(frame);
                    else buttonAnim = null;
                }
                requestAnimationFrame(frame);
            }
            function screenDelta(sign) {
                const horizontal = document.body.classList.contains("wide");
                return sign * 0.8 * (horizontal ? window.innerWidth : window.innerHeight);
            }
            fwdBtn.addEventListener("click", () => smoothScrollBy(screenDelta(1)));
            backBtn.addEventListener("click", () => smoothScrollBy(screenDelta(-1)));

            skipFwdBtn.addEventListener("click", () => smoothScrollBy(Number.MAX_SAFE_INTEGER));
            skipBackBtn.addEventListener("click", () => smoothScrollBy(-Number.MAX_SAFE_INTEGER));

            if (PORTFOLIO_IMAGES.length > 1 &&
                !window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
                setTimeout(() => {
                    if (!userScrolled) runNudge();
                }, 3000);
            }
        </script>
