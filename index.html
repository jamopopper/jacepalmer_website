<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <meta name="color-scheme" content="dark" />
        <meta name="theme-color" content="#000000" />
        <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon.ico/favicon-32x32.png" />
        <title>Jace Palmer</title>
        <style>
            html, body {
                margin: 0;
                height: 100%;
                background: #000;
            }
            body {
                display: grid;
                place-items: center;
                height: 100dvh;
            }
            img {
                width: 80vmin;
                height: auto;
                filter: invert(1);
                animation: ebb 3.5s ease-in-out infinite alternate;
            }
            @keyframes ebb {
                from { transform: scale(0.94); opacity: 0.25; }
                to { transform: scale(1.06); opacity: 0.75; }
            }
            @media (prefers-reduced-motion: reduce) {
                img { animation: none; }
            }
        </style>
    </head>
    <body>
        <img src="/images/jp_logo-01.png" alt="Jace Palmer" />
    </body>
</html>
